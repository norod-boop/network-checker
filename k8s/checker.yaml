apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-checker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: network-checker
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: network-checker
subjects:
  - kind: ServiceAccount
    name: network-checker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: network-checker
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: network-checker-pusher
data:
  PUSHGATEWAY_URL: "http://pushgateway.monitoring.svc.cluster.local:9091"
  PUSH_INTERVAL_SECONDS: "60"
  push.sh: |
    #!/bin/sh
    set -eu

    interval="${PUSH_INTERVAL_SECONDS:-60}"
    url="${PUSHGATEWAY_URL%/}/metrics/job/network-checker/namespace/${NAMESPACE_NAME}"

    while true; do
      if [ -s /tmp/metrics.prom ]; then
        if curl --fail --silent --show-error \
          --header "Content-Type: text/plain; version=0.0.4" \
          --data-binary @/tmp/metrics.prom "$url"; then
          echo "Pushed metrics to $url"
        else
          echo "Failed to push metrics to $url" >&2
        fi
      else
        echo "Waiting for metrics.prom" >&2
      fi
      sleep "$interval"
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-checker
  labels:
    app: network-checker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-checker
  template:
    metadata:
      labels:
        app: network-checker
    spec:
      serviceAccountName: network-checker
      terminationGracePeriodSeconds: 15
      containers:
        - name: network-checker
          image: network-checker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CHECK_INTERVAL_SECONDS
              value: "60"
          ports:
            - name: health
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["NET_RAW"]
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: metrics
              mountPath: /tmp
        - name: metrics-pusher
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/config/push.sh"]
          env:
            - name: NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PUSHGATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: network-checker-pusher
                  key: PUSHGATEWAY_URL
            - name: PUSH_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: network-checker-pusher
                  key: PUSH_INTERVAL_SECONDS
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: metrics
              mountPath: /tmp
              readOnly: true
            - name: pusher-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: metrics
          emptyDir: {}
        - name: pusher-config
          configMap:
            name: network-checker-pusher