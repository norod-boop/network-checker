apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-checker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/norod-boop/k8s-network-checker.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: network-checker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true