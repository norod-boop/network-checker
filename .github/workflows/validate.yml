name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check kubernetes==22.6.0 PyYAML
      - run: python -m unittest -v test_network_checker.py
      - run: python -m py_compile network-checker.py test_network_checker.py
      - run: |
          python - <<'PY'
          import yaml

          for path in (
              "k8s/checker.yaml",
              "k8s/kustomization.yaml",
              "argocd/application.yaml",
          ):
              with open(path, encoding="utf-8") as file:
                  list(yaml.safe_load_all(file))
          print("YAML validation passed")
          PY

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
